<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zadania</title>
  <meta name="description" content="Zadania i notatki z kalendarzem Google">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div id="scrim" class="scrim"></div>
    <aside id="sidebar">
      <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>Zadania</span></div>
      <nav id="nav"></nav>
      <div class="side-section">
        <div class="side-head"><span>Listy</span><button class="icon-btn sm" id="addList" title="Nowa lista" aria-label="Nowa lista"></button></div>
        <nav id="listsNav"></nav>
      </div>
      <div class="side-section" id="tagsSec" hidden>
        <div class="side-head"><span>Tagi</span></div>
        <nav id="tagsNav"></nav>
      </div>
      <div class="side-foot">
        <button class="sync-status" id="syncStatus" title="Synchronizuj teraz"></button>
        <button class="nav-btn" id="openSettings"></button>
      </div>
    </aside>

    <main id="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Menu"></button>
        <h1 id="viewTitle">Dziś</h1>
        <div class="search"><span class="search-ico"></span><input id="search" type="search" placeholder="Szukaj lub #tag" autocomplete="off"></div>
        <div id="viewTools" class="view-tools"></div>
      </header>
      <div id="banner"></div>
      <section id="view" tabindex="-1"></section>
      <form id="quickAdd" autocomplete="off">
        <button type="button" id="qaType" class="qa-type" title="Zadanie / notatka"></button>
        <div class="qa-field">
          <input id="qaInput" placeholder="Dodaj zadanie – np. „jutro 15:00 1h spotkanie”" enterkeyhint="done">
          <div id="qaPreview" class="qa-preview"></div>
        </div>
        <button type="submit" class="qa-add" aria-label="Dodaj"></button>
      </form>
    </main>

    <aside id="detail" aria-hidden="true"></aside>
  </div>
  <div id="modalRoot"></div>
  <div id="toasts"></div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/google.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
